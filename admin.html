
<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RADAR ADMIN</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#f3f4f6;
 font-family:Arial,sans-serif;
 color:#222;
}
header{
 background:#171717;
 color:#ffcc00;
 padding:22px;
 text-align:center;
}
main{
 max-width:850px;
 margin:20px auto;
 padding:15px;
}
.card{
 background:white;
 padding:20px;
 border-radius:12px;
 margin-bottom:18px;
}
input,textarea,select{
 width:100%;
 padding:13px;
 margin:7px 0 14px;
 border:1px solid #ccc;
 border-radius:7px;
 font-size:16px;
}
button{
 padding:13px 18px;
 border:0;
 border-radius:7px;
 background:#ffcc00;
 font-weight:bold;
 margin:4px;
 cursor:pointer;
}
.excluir{
 background:#e74c3c;
 color:white;
}
.produto{
 border:1px solid #ddd;
 padding:12px;
 border-radius:8px;
 margin:12px 0;
 background:#fff;
}
.produto img{
 width:110px;
 height:110px;
 object-fit:contain;
 display:block;
 margin:10px 0;
}
.oculto{display:none}
#erro{color:#c0392b}
#mensagem{font-weight:bold}
</style>
</head>

<body>

<header>
<h1>🔥 RADAR ADMIN</h1>
<p>Painel de gerenciamento de ofertas</p>
</header>

<main>

<section class="card" id="login">
<h2>Entrar como administrador</h2>

<label>E-mail</label>
<input id="email" type="email" placeholder="Seu e-mail">

<label>Senha</label>
<input id="senha" type="password" placeholder="Sua senha">

<button id="botaoEntrar" onclick="entrar()">ENTRAR</button>

<p id="erro"></p>
</section>

<section id="painel" class="oculto">

<div class="card">
<h2>Cadastrar ou editar produto</h2>

<input type="hidden" id="produtoId">

<label>Nome do produto</label>
<input id="nome" placeholder="Nome do produto">

<label>Descrição</label>
<textarea id="descricao" placeholder="Descrição do produto"></textarea>

<label>Preço (R$)</label>
<input id="preco" type="number" step="0.01" placeholder="99.90">

<label>Link da foto</label>
<input id="imagem" type="url" placeholder="https://...">

<label>Categoria</label>
<select id="categoria">
<option>Automotivos</option>
<option>Beleza</option>
<option>Casa e Cozinha</option>
<option>Acessórios</option>
<option>Tecnologia</option>
<option>Outros</option>
</select>

<label>Link de afiliado</label>
<input id="link" type="url" placeholder="https://...">

<button onclick="salvar()">SALVAR PRODUTO</button>
<button onclick="limpar()">LIMPAR</button>

<p id="mensagem"></p>
</div>

<div class="card">
<h2>Produtos cadastrados</h2>
<button onclick="carregar()">ATUALIZAR LISTA</button>
<div id="lista"></div>
</div>

<button onclick="sair()">SAIR DO PAINEL</button>

</section>
</main>

<script>
const SUPABASE_URL =
"https://uwfytxaugywzdijoyezd.supabase.co";

const SUPABASE_KEY =
"sb_publishable_7iq6onXdN353hZVSYc-7MA_RFhz1KEU";

const db = supabase.createClient(
 SUPABASE_URL,
 SUPABASE_KEY
);

function normalizar(valor){
 return String(valor)
 .normalize("NFD")
 .replace(/[\u0300-\u036f]/g,"")
 .toLowerCase()
 .replace(/[^a-z0-9]/g,"");
}

function encontrarCampo(obj,nomes){
 const chave = Object.keys(obj).find(k =>
  nomes.includes(normalizar(k))
 );
 return chave ? obj[chave] : undefined;
}

async function verificarAdmin(user){
 const {data,error} = await db
 .from("administradores")
 .select("*");

 if(error){
  throw new Error(
   "Erro ao consultar administradores: "+error.message
  );
 }

 const admin = (data || []).find(row => {
  const email = encontrarCampo(row,["email"]);
  const uid = encontrarCampo(row,[
   "userid",
   "idusuario",
   "iddousuario",
   "idusuario_uuid"
  ]);

  if(email !== undefined && uid !== undefined){
   return String(email).toLowerCase() ===
    user.email.toLowerCase() &&
    String(uid) === user.id;
  }

  if(email !== undefined){
   return String(email).toLowerCase() ===
    user.email.toLowerCase();
  }

  if(uid !== undefined){
   return String(uid) === user.id;
  }

  return false;
 });

 return !!admin;
}

async function entrar(){
 const email = document.getElementById("email").value.trim();
 const senha = document.getElementById("senha").value;
 const erro = document.getElementById("erro");
 const botao = document.getElementById("botaoEntrar");

 if(!email || !senha){
  erro.textContent = "Informe seu e-mail e sua senha.";
  return;
 }

 botao.disabled = true;
 erro.textContent = "Verificando acesso...";

 try{
  const {data,error} = await db.auth.signInWithPassword({
   email,
   password:senha
  });

  if(error) throw error;

  const autorizado = await verificarAdmin(data.user);

  if(!autorizado){
   await db.auth.signOut();
   throw new Error(
    "Usuário não cadastrado como administrador."
   );
  }

  abrirPainel();
 }catch(error){
  erro.textContent = "Erro: "+error.message;
 }finally{
  botao.disabled = false;
 }
}

function abrirPainel(){
 document.getElementById("login").classList.add("oculto");
 document.getElementById("painel").classList.remove("oculto");
 carregar();
}

async function carregar(){
 const lista = document.getElementById("lista");
 lista.textContent = "Carregando produtos...";

 const {data,error} = await db
 .from("produtos")
 .select("*")
 .order("id",{ascending:false});

 if(error){
  lista.textContent = "Erro: "+error.message;
  return;
 }

 lista.innerHTML = "";

 if(!data || data.length === 0){
  lista.textContent = "Nenhum produto cadastrado ainda.";
  return;
 }

 data.forEach(p => {
  const div = document.createElement("div");
  div.className = "produto";

  const titulo = document.createElement("strong");
  titulo.textContent = p.nome || "Sem nome";
  div.appendChild(titulo);

  if(p.imagem_url){
   const img = document.createElement("img");
   img.src = p.imagem_url;
   img.alt = p.nome || "Produto";
   div.appendChild(img);
  }

  const info = document.createElement("p");
  info.textContent =
   "Preço: R$ "+(p.preco ?? "Não informado")+
   " | Categoria: "+(p.categoria || "");
  div.appendChild(info);

  const editar = document.createElement("button");
  editar.textContent = "EDITAR";
  editar.onclick = () => editarProduto(p);
  div.appendChild(editar);

  const excluir = document.createElement("button");
  excluir.textContent = "EXCLUIR";
  excluir.className = "excluir";
  excluir.onclick = () => excluirProduto(p.id);
  div.appendChild(excluir);

  lista.appendChild(div);
 });
}

async function salvar(){
 const id = document.getElementById("produtoId").value;

 const produto = {
  nome:document.getElementById("nome").value.trim(),
  descricao:document.getElementById("descricao").value.trim(),
  preco:document.getElementById("preco").value
   ? Number(document.getElementById("preco").value)
   : null,
  imagem_url:document.getElementById("imagem").value.trim(),
  categoria:document.getElementById("categoria").value,
  link_afiliado:document.getElementById("link").value.trim()
 };

 const msg = document.getElementById("mensagem");

 if(!produto.nome){
  msg.textContent = "Informe o nome do produto.";
  return;
 }

 msg.textContent = "Salvando produto...";

 let resultado;

 if(id){
  resultado = await db
   .from("produtos")
   .update(produto)
   .eq("id",id);
 }else{
  resultado = await db
   .from("produtos")
   .insert(produto);
 }

 if(resultado.error){
  msg.textContent = "Erro: "+resultado.error.message;
  return;
 }

 msg.textContent = "Produto salvo com sucesso!";
 limpar();
 carregar();
}

function editarProduto(p){
 document.getElementById("produtoId").value = p.id;
 document.getElementById("nome").value = p.nome || "";
 document.getElementById("descricao").value = p.descricao || "";
 document.getElementById("preco").value = p.preco ?? "";
 document.getElementById("imagem").value = p.imagem_url || "";
 document.getElementById("categoria").value = p.categoria || "Outros";
 document.getElementById("link").value = p.link_afiliado || "";

 window.scrollTo({top:0,behavior:"smooth"});
}

async function excluirProduto(id){
 if(!confirm("Tem certeza que deseja excluir este produto?")){
  return;
 }

 const {error} = await db
  .from("produtos")
  .delete()
  .eq("id",id);

 if(error){
  alert("Erro ao excluir: "+error.message);
  return;
 }

 alert("Produto excluído com sucesso!");
 carregar();
}

function limpar(){
 [
  "produtoId",
  "nome",
  "descricao",
  "preco",
  "imagem",
  "link"
 ].forEach(id => {
  document.getElementById(id).value = "";
 });

 document.getElementById("mensagem").textContent = "";
}

async function sair(){
 await db.auth.signOut();
 location.reload();
}

async function restaurarSessao(){
 const {data,error} = await db.auth.getSession();

 if(error || !data.session) return;

 try{
  const autorizado = await verificarAdmin(data.session.user);

  if(autorizado){
   abrirPainel();
  }else{
   await db.auth.signOut();
  }
 }catch(error){
  document.getElementById("erro").textContent =
   "Erro ao verificar administrador: "+error.message;
 }
}

restaurarSessao();
</script>

</body>
</html>
